name:                trout
version:             2.0.0.0
github:              "Osrepnay/trout"
license:             MIT
author:              "Osrepnay"
maintainer:          "example@example.com"
copyright:           "2022-2026 Osrepnay"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/Osrepnay/trout#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- hashable
- parsec
- transformers
- unordered-containers
- vector
- time
# - inspection-testing

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

language: GHC2021

# default-extensions:

library:
  source-dirs: src

executables:
  trout-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N1
    # -O2 is slower, idk why
    - -O1
    dependencies:
    - trout

tests:
  trout-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - trout
    - hspec
    - QuickCheck
    - split

benchmarks:
  trout-bench:
    main: Bench.hs
    source-dirs: bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - trout
    - criterion
    - deepseq
